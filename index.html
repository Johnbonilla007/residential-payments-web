<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#002147" />
    <meta name="google" content="notranslate" />

    <meta
      name="description"
      content="Sistema de Pagos Residenciales - Gestión moderna y eficiente de pagos"
    />
    <link rel="apple-touch-icon" href="/logo192.png" />

    <!-- Google Fonts - Inter for premium typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>Sistema de Pagos Residenciales</title>
    <script>
      // Resolve the theme before the first paint so the page never flashes the
      // wrong background. ThemeContext writes the full token set once React
      // mounts; this only needs the two tokens the initial paint reads.
      (function () {
        try {
          var stored = window.localStorage.getItem("app-theme");
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia &&
                window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
          var root = document.documentElement;
          root.setAttribute("data-theme", theme);
          root.style.colorScheme = theme;
          root.style.setProperty(
            "--surface-ground",
            theme === "dark" ? "#0b1220" : "#f4f6f9"
          );
          root.style.setProperty(
            "--text-color",
            theme === "dark" ? "#e6edf6" : "#1f2937"
          );
        } catch (error) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.jsx"></script>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
